<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - Liceo José Augusto D' León</title>
    <!-- FullCalendar -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <!-- SweetAlert2 para modales bonitos -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #b8e2f2;
            padding: 20px;
            transition: all 0.3s ease;
        }

        /* MODO OSCURO */
        body.modo-oscuro {
            background-color: #1a1a2e;
            color: #fff;
        }

        body.modo-oscuro .card {
            background: #16213e;
            border-color: #0f3460;
            color: #fff;
        }

        body.modo-oscuro .card h2,
        body.modo-oscuro .card h3,
        body.modo-oscuro .card p {
            color: #fff;
        }

        body.modo-oscuro .header {
            background: linear-gradient(145deg, #0f3460, #1a1a2e);
        }

        body.modo-oscuro input,
        body.modo-oscuro select,
        body.modo-oscuro textarea {
            background: #0f3460;
            color: white;
            border-color: #1a1a2e;
        }

        body.modo-oscuro .fc {
            color: #fff;
        }

        body.modo-oscuro .fc-toolbar-title {
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(145deg, #2a7faa, #1e5f7e);
            color: white;
            padding: 20px 30px;
            border-radius: 30px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .modo-oscuro-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .user-badge {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 2px solid rgba(255,255,255,0.6);
            margin-bottom: 20px;
        }

        .card h2 {
            color: #0b3b5c;
            margin-bottom: 20px;
            font-size: 1.8rem;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            padding-bottom: 10px;
        }

        .card h3 {
            color: #1e4a6b;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #1e4a6b;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2a7faa;
            outline: none;
        }

        .form-group textarea {
            border-radius: 20px;
            resize: vertical;
        }

        .btn {
            background: linear-gradient(145deg, #2a7faa, #1e5f7e);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-success {
            background: linear-gradient(145deg, #27ae60, #219a52);
        }

        .btn-warning {
            background: linear-gradient(145deg, #f39c12, #e67e22);
        }

        .btn-danger {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
        }

        .filtros {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filtro-item {
            flex: 1;
            min-width: 150px;
        }

        #calendario {
            background: white;
            border-radius: 30px;
            padding: 20px;
            min-height: 600px;
        }

        .evento-item {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 2px solid rgba(255,255,255,0.6);
            transition: all 0.3s;
            cursor: pointer;
        }

        .evento-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .evento-titulo {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0b3b5c;
            margin-bottom: 10px;
        }

        .evento-descripcion {
            color: #666;
            margin-bottom: 10px;
        }

        .evento-meta {
            display: flex;
            gap: 15px;
            color: #999;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }

        .evento-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge {
            background: #2a7faa;
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            display: inline-block;
        }

        .badge-success {
            background: #27ae60;
        }

        .badge-warning {
            background: #f39c12;
        }

        .badge-danger {
            background: #e74c3c;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #2a7faa;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #0b3b5c;
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <a href="dashboard.html" class="back-btn">← Volver</a>
                <h1>📅 Sistema de Eventos</h1>
            </div>
            <div class="header-right">
                <button class="modo-oscuro-btn" onclick="toggleModoOscuro()" title="Cambiar tema">🌙</button>
                <div class="user-badge" id="userInfo">Cargando...</div>
            </div>
        </div>

        <!-- Estadísticas -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="eventosHoy">3</div>
                <div class="stat-label">Eventos hoy</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="eventosSemana">8</div>
                <div class="stat-label">Esta semana</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="eventosMes">15</div>
                <div class="stat-label">Este mes</div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card">
            <h2>🔍 Filtrar Eventos</h2>
            <div class="filtros">
                <div class="filtro-item">
                    <select id="filtroAnio" onchange="filtrarEventos()">
                        <option value="">Todos los años</option>
                        <option value="1er año">1er año</option>
                        <option value="2do año">2do año</option>
                        <option value="3er año">3er año</option>
                        <option value="4to año">4to año</option>
                        <option value="5to año">5to año</option>
                    </select>
                </div>
                <div class="filtro-item">
                    <select id="filtroSeccion" onchange="filtrarEventos()">
                        <option value="">Todas las secciones</option>
                        <option value="A">Sección A</option>
                        <option value="B">Sección B</option>
                        <option value="C">Sección C</option>
                        <option value="D">Sección D</option>
                    </select>
                </div>
                <div class="filtro-item">
                    <select id="filtroMes" onchange="filtrarEventos()">
                        <option value="">Todos los meses</option>
                        <option value="0">Enero</option>
                        <option value="1">Febrero</option>
                        <option value="2">Marzo</option>
                        <option value="3">Abril</option>
                        <option value="4">Mayo</option>
                        <option value="5">Junio</option>
                        <option value="6">Julio</option>
                        <option value="7">Agosto</option>
                        <option value="8">Septiembre</option>
                        <option value="9">Octubre</option>
                        <option value="10">Noviembre</option>
                        <option value="11">Diciembre</option>
                    </select>
                </div>
                <button class="btn" onclick="limpiarFiltros()">Limpiar</button>
            </div>
        </div>

        <!-- Grid principal -->
        <div class="grid-2">
            <!-- Calendario -->
            <div class="card">
                <h2>📆 Calendario</h2>
                <div id="calendario"></div>
            </div>

            <!-- Formulario y lista -->
            <div>
                <!-- Formulario para crear evento -->
                <div class="card">
                    <h2>➕ Crear Nuevo Evento</h2>
                    
                    <div class="form-group">
                        <label>Título del evento</label>
                        <input type="text" id="titulo" placeholder="Ej: Entrega de proyectos" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="descripcion" rows="3" placeholder="Detalles del evento..."></textarea>
                    </div>
                    
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Fecha de inicio</label>
                            <input type="datetime-local" id="fechaInicio" required>
                        </div>
                        <div class="form-group">
                            <label>Fecha de fin</label>
                            <input type="datetime-local" id="fechaFin">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Color del evento</label>
                        <input type="color" id="color" value="#2a7faa">
                    </div>
                    
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Año destino</label>
                            <select id="anio">
                                <option value="">Todos los años</option>
                                <option value="1er año">1er año</option>
                                <option value="2do año">2do año</option>
                                <option value="3er año">3er año</option>
                                <option value="4to año">4to año</option>
                                <option value="5to año">5to año</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Sección destino</label>
                            <select id="seccion">
                                <option value="">Todas las secciones</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Notificación</label>
                        <select id="notificacion">
                            <option value="0">Sin notificación</option>
                            <option value="5">5 minutos antes</option>
                            <option value="15">15 minutos antes</option>
                            <option value="30">30 minutos antes</option>
                            <option value="60">1 hora antes</option>
                            <option value="1440">1 día antes</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-success" onclick="crearEvento()" style="width:100%;">📌 Crear Evento</button>
                </div>

                <!-- Lista de eventos próximos -->
                <div class="card">
                    <h2>📋 Próximos Eventos</h2>
                    <div id="lista-eventos">
                        <!-- Se cargará dinámicamente -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Vista de todos los eventos -->
        <div class="card">
            <h2>📅 Todos los Eventos</h2>
            <div id="todos-eventos" class="grid-3">
                <!-- Se cargará dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Modal para ver detalles del evento -->
    <div id="modalEvento" class="modal">
        <div class="modal-content">
            <h3 id="modalTitulo">Detalles del Evento</h3>
            <div id="modalContenido"></div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                <button class="btn btn-warning" onclick="editarEvento()">✏️ Editar</button>
                <button class="btn btn-danger" onclick="eliminarEvento()">🗑️ Eliminar</button>
                <button class="btn" onclick="cerrarModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // ===== CONFIGURACIÓN INICIAL =====
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = 'login.html';
        }

        document.getElementById('userInfo').innerHTML = `
            <strong>${user.nombre}</strong><br>
            <small>${user.rol}</small>
        `;

        // Variables globales
        let calendar;
        let eventos = [];

        // ===== MODO OSCURO =====
        function toggleModoOscuro() {
            document.body.classList.toggle('modo-oscuro');
            const btn = document.querySelector('.modo-oscuro-btn');
            if (document.body.classList.contains('modo-oscuro')) {
                btn.textContent = '☀️';
                localStorage.setItem('modoOscuro', 'true');
            } else {
                btn.textContent = '🌙';
                localStorage.setItem('modoOscuro', 'false');
            }
        }

        if (localStorage.getItem('modoOscuro') === 'true') {
            document.body.classList.add('modo-oscuro');
            document.querySelector('.modo-oscuro-btn').textContent = '☀️';
        }

        // ===== CALENDARIO =====
        function inicializarCalendario() {
            const calendarEl = document.getElementById('calendario');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                buttonText: {
                    today: 'Hoy',
                    month: 'Mes',
                    week: 'Semana',
                    day: 'Día'
                },
                events: cargarEventosCalendario(),
                eventClick: function(info) {
                    mostrarDetalleEvento(info.event);
                },
                dateClick: function(info) {
                    document.getElementById('fechaInicio').value = info.dateStr + 'T09:00';
                }
            });
            calendar.render();
        }

        function cargarEventosCalendario() {
            // Eventos de ejemplo
            return [
                {
                    id: 1,
                    title: 'Entrega de notas',
                    start: '2024-05-30T10:00:00',
                    end: '2024-05-30T12:00:00',
                    color: '#2a7faa',
                    description: 'Entrega de calificaciones del segundo lapso',
                    destinatarios: '4to año A'
                },
                {
                    id: 2,
                    title: 'Día del estudiante',
                    start: '2024-06-15T08:00:00',
                    end: '2024-06-15T18:00:00',
                    color: '#27ae60',
                    description: 'Celebración del día del estudiante con actividades',
                    destinatarios: 'Todos'
                },
                {
                    id: 3,
                    title: 'Reunión de padres',
                    start: '2024-06-20T17:00:00',
                    end: '2024-06-20T19:00:00',
                    color: '#f39c12',
                    description: 'Entrega de boletines y reunión general',
                    destinatarios: '5to año'
                },
                {
                    id: 4,
                    title: 'Proyecto ITP',
                    start: '2024-05-25T14:00:00',
                    end: '2024-05-25T16:00:00',
                    color: '#e74c3c',
                    description: 'Entrega de proyectos de ITP',
                    destinatarios: '3er año D'
                }
            ];
        }

        // ===== CARGAR EVENTOS =====
        function cargarEventos() {
            eventos = [
                {
                    id: 1,
                    titulo: 'Entrega de notas',
                    descripcion: 'Entrega de calificaciones del segundo lapso',
                    fecha: '2024-05-30',
                    hora: '10:00',
                    año: '4to año',
                    seccion: 'A',
                    color: '#2a7faa'
                },
                {
                    id: 2,
                    titulo: 'Día del estudiante',
                    descripcion: 'Celebración con actividades recreativas',
                    fecha: '2024-06-15',
                    hora: '08:00',
                    año: '',
                    seccion: '',
                    color: '#27ae60'
                },
                {
                    id: 3,
                    titulo: 'Reunión de padres',
                    descripcion: 'Entrega de boletines y reunión general',
                    fecha: '2024-06-20',
                    hora: '17:00',
                    año: '5to año',
                    seccion: '',
                    color: '#f39c12'
                },
                {
                    id: 4,
                    titulo: 'Proyecto ITP',
                    descripcion: 'Entrega de proyectos de ITP',
                    fecha: '2024-05-25',
                    hora: '14:00',
                    año: '3er año',
                    seccion: 'D',
                    color: '#e74c3c'
                },
                {
                    id: 5,
                    titulo: 'Jornada científica',
                    descripcion: 'Exposición de trabajos científicos',
                    fecha: '2024-06-05',
                    hora: '09:00',
                    año: '4to año',
                    seccion: 'B',
                    color: '#9b59b6'
                }
            ];

            actualizarListaEventos();
            actualizarTodosEventos();
            actualizarEstadisticas();
        }

        // ===== ACTUALIZAR LISTA DE EVENTOS PRÓXIMOS =====
        function actualizarListaEventos() {
            const lista = document.getElementById('lista-eventos');
            const hoy = new Date();
            const eventosProximos = eventos
                .filter(e => new Date(e.fecha) >= hoy)
                .sort((a, b) => new Date(a.fecha) - new Date(b.fecha))
                .slice(0, 5);

            lista.innerHTML = '';

            if (eventosProximos.length === 0) {
                lista.innerHTML = '<p style="text-align:center; color:#999;">No hay eventos próximos</p>';
                return;
            }

            eventosProximos.forEach(evento => {
                const fecha = new Date(evento.fecha).toLocaleDateString();
                lista.innerHTML += `
                    <div class="evento-item" onclick="mostrarDetalleEventoId(${evento.id})">
                        <div class="evento-titulo" style="color:${evento.color};">📌 ${evento.titulo}</div>
                        <div class="evento-descripcion">${evento.descripcion}</div>
                        <div class="evento-meta">
                            <span>📅 ${fecha} - ${evento.hora}</span>
                            <span>👥 ${evento.año || 'Todos'} ${evento.seccion ? 'Secc ' + evento.seccion : ''}</span>
                        </div>
                    </div>
                `;
            });
        }

        // ===== ACTUALIZAR TODOS LOS EVENTOS =====
        function actualizarTodosEventos() {
            const contenedor = document.getElementById('todos-eventos');
            
            contenedor.innerHTML = '';

            eventos.forEach(evento => {
                const fecha = new Date(evento.fecha).toLocaleDateString();
                contenedor.innerHTML += `
                    <div class="evento-item" onclick="mostrarDetalleEventoId(${evento.id})">
                        <div class="evento-titulo" style="color:${evento.color};">📌 ${evento.titulo}</div>
                        <div class="evento-descripcion">${evento.descripcion}</div>
                        <div class="evento-meta">
                            <span>📅 ${fecha} - ${evento.hora}</span>
                            <span>👥 ${evento.año || 'Todos'} ${evento.seccion ? 'Secc ' + evento.seccion : ''}</span>
                        </div>
                        <span class="badge" style="background:${evento.color};">${evento.año || 'General'}</span>
                    </div>
                `;
            });
        }

        // ===== ACTUALIZAR ESTADÍSTICAS =====
        function actualizarEstadisticas() {
            const hoy = new Date().toISOString().split('T')[0];
            const hoyEventos = eventos.filter(e => e.fecha === hoy).length;
            
            const semana = new Date();
            semana.setDate(semana.getDate() + 7);
            const semanaEventos = eventos.filter(e => new Date(e.fecha) <= semana).length;
            
            const mes = new Date();
            mes.setMonth(mes.getMonth() + 1);
            const mesEventos = eventos.filter(e => new Date(e.fecha) <= mes).length;

            document.getElementById('eventosHoy').textContent = hoyEventos;
            document.getElementById('eventosSemana').textContent = semanaEventos;
            document.getElementById('eventosMes').textContent = mesEventos;
        }

        // ===== FILTRAR EVENTOS =====
        function filtrarEventos() {
            const anio = document.getElementById('filtroAnio').value;
            const seccion = document.getElementById('filtroSeccion').value;
            const mes = document.getElementById('filtroMes').value;

            let eventosFiltrados = eventos;

            if (anio) {
                eventosFiltrados = eventosFiltrados.filter(e => e.año === anio);
            }
            if (seccion) {
                eventosFiltrados = eventosFiltrados.filter(e => e.seccion === seccion);
            }
            if (mes !== '') {
                eventosFiltrados = eventosFiltrados.filter(e => new Date(e.fecha).getMonth() === parseInt(mes));
            }

            const contenedor = document.getElementById('todos-eventos');
            contenedor.innerHTML = '';

            if (eventosFiltrados.length === 0) {
                contenedor.innerHTML = '<p style="text-align:center; color:#999;">No hay eventos con esos filtros</p>';
                return;
            }

            eventosFiltrados.forEach(evento => {
                const fecha = new Date(evento.fecha).toLocaleDateString();
                contenedor.innerHTML += `
                    <div class="evento-item" onclick="mostrarDetalleEventoId(${evento.id})">
                        <div class="evento-titulo" style="color:${evento.color};">📌 ${evento.titulo}</div>
                        <div class="evento-descripcion">${evento.descripcion}</div>
                        <div class="evento-meta">
                            <span>📅 ${fecha} - ${evento.hora}</span>
                            <span>👥 ${evento.año || 'Todos'} ${evento.seccion ? 'Secc ' + evento.seccion : ''}</span>
                        </div>
                    </div>
                `;
            });
        }

        function limpiarFiltros() {
            document.getElementById('filtroAnio').value = '';
            document.getElementById('filtroSeccion').value = '';
            document.getElementById('filtroMes').value = '';
            actualizarTodosEventos();
        }

        // ===== CREAR EVENTO =====
        function crearEvento() {
            const titulo = document.getElementById('titulo').value;
            const descripcion = document.getElementById('descripcion').value;
            const fechaInicio = document.getElementById('fechaInicio').value;
            const color = document.getElementById('color').value;
            const anio = document.getElementById('anio').value;
            const seccion = document.getElementById('seccion').value;

            if (!titulo || !fechaInicio) {
                Swal.fire({
                    title: 'Error',
                    text: 'El título y la fecha son obligatorios',
                    icon: 'error',
                    confirmButtonColor: '#2a7faa'
                });
                return;
            }

            const nuevoEvento = {
                id: eventos.length + 1,
                titulo: titulo,
                descripcion: descripcion,
                fecha: fechaInicio.split('T')[0],
                hora: fechaInicio.split('T')[1] || '00:00',
                año: anio,
                seccion: seccion,
                color: color
            };

            eventos.push(nuevoEvento);
            
            Swal.fire({
                title: '¡Evento creado!',
                text: 'El evento ha sido creado exitosamente',
                icon: 'success',
                confirmButtonColor: '#2a7faa'
            });

            // Limpiar formulario
            document.getElementById('titulo').value = '';
            document.getElementById('descripcion').value = '';
            document.getElementById('fechaInicio').value = '';
            document.getElementById('fechaFin').value = '';
            
            actualizarListaEventos();
            actualizarTodosEventos();
            actualizarEstadisticas();
            
            // Mostrar notificación
            if (document.getElementById('notificacion').value > 0) {
                Swal.fire({
                    title: 'Notificación programada',
                    text: `Se notificará a los estudiantes ${document.getElementById('notificacion').selectedOptions[0].text}`,
                    icon: 'info',
                    confirmButtonColor: '#2a7faa'
                });
            }
        }

        // ===== MOSTRAR DETALLE DEL EVENTO =====
        function mostrarDetalleEventoId(id) {
            const evento = eventos.find(e => e.id === id);
            if (evento) {
                const fecha = new Date(evento.fecha).toLocaleDateString();
                document.getElementById('modalTitulo').textContent = evento.titulo;
                document.getElementById('modalContenido').innerHTML = `
                    <p><strong>Descripción:</strong> ${evento.descripcion}</p>
                    <p><strong>Fecha:</strong> ${fecha} - ${evento.hora}</p>
                    <p><strong>Dirigido a:</strong> ${evento.año || 'Todos'} ${evento.seccion ? 'Sección ' + evento.seccion : ''}</p>
                    <p><strong>Color:</strong> <span style="display:inline-block; width:20px; height:20px; background:${evento.color}; border-radius:5px;"></span></p>
                `;
                document.getElementById('modalEvento').style.display = 'flex';
            }
        }

        function mostrarDetalleEvento(eventInfo) {
            document.getElementById('modalTitulo').textContent = eventInfo.title;
            document.getElementById('modalContenido').innerHTML = `
                <p><strong>Descripción:</strong> ${eventInfo.extendedProps.description}</p>
                <p><strong>Dirigido a:</strong> ${eventInfo.extendedProps.destinatarios}</p>
                <p><strong>Fecha:</strong> ${eventInfo.start.toLocaleString()}</p>
            `;
            document.getElementById('modalEvento').style.display = 'flex';
        }

        function editarEvento() {
            alert('Función de editar evento');
            cerrarModal();
        }

        function eliminarEvento() {
            if (confirm('¿Está seguro de eliminar este evento?')) {
                alert('Evento eliminado');
                cerrarModal();
            }
        }

        function cerrarModal() {
            document.getElementById('modalEvento').style.display = 'none';
        }

        // ===== INICIALIZACIÓN =====
        document.addEventListener('DOMContentLoaded', function() {
            inicializarCalendario();
            cargarEventos();
        });

        // Cerrar modal al hacer clic fuera
        window.onclick = function(event) {
            const modal = document.getElementById('modalEvento');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
