<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Estudiante</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #b8e2f2;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(145deg, #2a7faa, #1e5f7e);
            color: white;
            padding: 25px 30px;
            border-radius: 30px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .user-badge {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 2px solid rgba(255,255,255,0.6);
        }
        .card h2 {
            color: #0b3b5c;
            margin-bottom: 20px;
            font-size: 1.8rem;
            border-bottom: 2px solid rgba(0,0,0,0.1);
            padding-bottom: 10px;
        }
        .card h3 {
            color: #1e4a6b;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px;
            background: rgba(42, 127, 170, 0.1);
            color: #0b3b5c;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .nota-alta {
            color: #27ae60;
            font-weight: 600;
        }
        .nota-baja {
            color: #e67e22;
            font-weight: 600;
        }
        .nota-muy-baja {
            color: #c0392b;
            font-weight: 600;
        }
        .badge {
            background: #2a7faa;
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            display: inline-block;
        }
        .badge-warning {
            background: #f39c12;
        }
        .badge-success {
            background: #27ae60;
        }
        .evento-item {
            padding: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .evento-item:last-child {
            border-bottom: none;
        }
        .evento-fecha {
            color: #666;
            font-size: 0.9rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(255,255,255,0.5);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.8);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0b3b5c;
        }
        .stat-label {
            color: #1e4a6b;
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="dashboard.html" class="back-btn">← Volver al Dashboard</a>
            <div class="user-badge" id="userInfo">Cargando...</div>
        </div>

        <!-- Estadísticas rápidas -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-number" id="promedioGeneral">-</div>
                <div class="stat-label">Promedio General</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="totalInasistencias">-</div>
                <div class="stat-label">Inasistencias</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="materiasAprobadas">-</div>
                <div class="stat-label">Materias Aprobadas</div>
            </div>
        </div>

        <div class="grid-2">
            <!-- Notas por materia -->
            <div class="card">
                <h2>📊 Mis Notas</h2>
                <table id="tablaNotas">
                    <thead>
                        <tr>
                            <th>Materia</th>
                            <th>Nota</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="notasBody">
                        <tr>
                            <td colspan="3">Cargando notas...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Inasistencias -->
            <div class="card">
                <h2>📅 Inasistencias</h2>
                <table id="tablaAsistencias">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Justificación</th>
                        </tr>
                    </thead>
                    <tbody id="asistenciasBody">
                        <tr>
                            <td colspan="3">Cargando asistencias...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Eventos próximos -->
        <div class="card">
            <h2>🔔 Próximos Eventos</h2>
            <div id="eventosList">
                <p>Cargando eventos...</p>
            </div>
        </div>

        <!-- Información personal -->
        <div class="card">
            <h2>📋 Mi Información</h2>
            <p id="infoPersonal">Cargando...</p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Verificar usuario
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = 'login.html';
        }

        // Mostrar info básica del usuario
        document.getElementById('userInfo').innerHTML = `
            <strong>${user.nombre}</strong> (${user.rol})
        `;

        // Información personal
        document.getElementById('infoPersonal').innerHTML = `
            <strong>Nombre:</strong> ${user.nombre}<br>
            <strong>Rol:</strong> ${user.rol}<br>
            <strong>ID de usuario:</strong> ${user.id}<br>
            <small>Los datos de año y sección se cargarán desde el backend</small>
        `;

        // Función para cargar notas reales desde el backend
        async function cargarNotas() {
            try {
                const response = await fetch(`${API_URL}/api/notas/${user.id}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const notas = await response.json();
                
                const tbody = document.getElementById('notasBody');
                tbody.innerHTML = '';
                
                let suma = 0;
                let aprobadas = 0;
                
                if (notas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">No hay notas registradas</td></tr>';
                } else {
                    notas.forEach(nota => {
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td>${nota.materia}</td>
                            <td class="${nota.nota >= 16 ? 'nota-alta' : (nota.nota >= 10 ? 'nota-baja' : 'nota-muy-baja')}">${nota.nota}</td>
                            <td>${new Date(nota.fecha).toLocaleDateString()}</td>
                        `;
                        suma += parseFloat(nota.nota);
                        if (nota.nota >= 10) aprobadas++;
                    });
                }
                
                // Actualizar estadísticas
                document.getElementById('promedioGeneral').textContent = 
                    notas.length > 0 ? (suma / notas.length).toFixed(2) : '-';
                document.getElementById('materiasAprobadas').textContent = aprobadas;
                
            } catch (error) {
                console.error('Error cargando notas:', error);
                document.getElementById('notasBody').innerHTML = 
                    '<tr><td colspan="3">Error al cargar notas. Datos de ejemplo:</td></tr>';
                // Datos de ejemplo si falla la conexión
                const tbody = document.getElementById('notasBody');
                tbody.innerHTML = `
                    <tr><td>Matemáticas</td><td class="nota-alta">18.5</td><td>15/05/2024</td></tr>
                    <tr><td>Historia</td><td class="nota-baja">14.0</td><td>10/05/2024</td></tr>
                    <tr><td>Química</td><td class="nota-alta">17.5</td><td>05/05/2024</td></tr>
                `;
            }
        }

        // Función para cargar asistencias reales
        async function cargarAsistencias() {
            try {
                const response = await fetch(`${API_URL}/api/asistencias/${user.id}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const asistencias = await response.json();
                
                const tbody = document.getElementById('asistenciasBody');
                tbody.innerHTML = '';
                
                let totalFaltas = 0;
                
                if (asistencias.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">No hay inasistencias registradas</td></tr>';
                } else {
                    asistencias.forEach(asis => {
                        if (!asis.presente) totalFaltas++;
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td>${new Date(asis.fecha).toLocaleDateString()}</td>
                            <td><span class="badge ${asis.presente ? 'badge-success' : 'badge-warning'}">${asis.presente ? 'Presente' : 'Ausente'}</span></td>
                            <td>${asis.justificado ? 'Justificado' : 'No justificado'}</td>
                        `;
                    });
                }
                
                document.getElementById('totalInasistencias').textContent = totalFaltas;
                
            } catch (error) {
                console.error('Error cargando asistencias:', error);
                document.getElementById('asistenciasBody').innerHTML = `
                    <tr><td>15/04/2024</td><td><span class="badge badge-warning">Ausente</span></td><td>Enfermedad</td></tr>
                    <tr><td>22/04/2024</td><td><span class="badge badge-warning">Ausente</span></td><td>Justificado</td></tr>
                    <tr><td>10/05/2024</td><td><span class="badge badge-warning">Ausente</span></td><td>Retraso</td></tr>
                `;
                document.getElementById('totalInasistencias').textContent = '3';
            }
        }

        // Función para cargar eventos
        async function cargarEventos() {
            try {
                const response = await fetch(`${API_URL}/api/eventos`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const eventos = await response.json();
                
                const eventosList = document.getElementById('eventosList');
                eventosList.innerHTML = '';
                
                if (eventos.length === 0) {
                    eventosList.innerHTML = '<p>No hay eventos próximos</p>';
                } else {
                    eventos.forEach(evento => {
                        eventosList.innerHTML += `
                            <div class="evento-item">
                                <div>
                                    <strong>${evento.titulo}</strong><br>
                                    <small>${evento.descripcion}</small>
                                </div>
                                <div class="evento-fecha">${new Date(evento.fecha_evento).toLocaleDateString()}</div>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                console.error('Error cargando eventos:', error);
                document.getElementById('eventosList').innerHTML = `
                    <div class="evento-item">
                        <div><strong>📌 Entrega de notas</strong><br><small>Segundo lapso</small></div>
                        <div class="evento-fecha">30/05/2024</div>
                    </div>
                    <div class="evento-item">
                        <div><strong>📌 Día del estudiante</strong><br><small>Celebración</small></div>
                        <div class="evento-fecha">15/06/2024</div>
                    </div>
                `;
            }
        }

        // Cargar todos los datos al iniciar
        cargarNotas();
        cargarAsistencias();
        cargarEventos();
    </script>
</body>
</html>
