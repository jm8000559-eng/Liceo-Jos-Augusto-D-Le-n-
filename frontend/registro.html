<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Liceo José Augusto D' León</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #b8e2f2 0%, #8fc5e8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .registro-card {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }
        h1 {
            text-align: center;
            color: #0b3b5c;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #1e4a6b;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50px;
            background: rgba(255,255,255,0.6);
            font-size: 1rem;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #2a7faa;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(145deg, #2a7faa, #1e5f7e);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .footer {
            text-align: center;
            margin-top: 20px;
        }
        .footer a {
            color: #2a7faa;
            text-decoration: none;
            font-weight: 600;
        }
        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="registro-card">
        <h1>Registro de Usuario</h1>
        <form id="registroForm">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label>Cédula</label>
                <input type="text" id="cedula" required>
            </div>
            <div class="form-group">
                <label>Teléfono 1</label>
                <input type="tel" id="telefono1" required>
            </div>
            <div class="form-group">
                <label>Teléfono 2 (opcional)</label>
                <input type="tel" id="telefono2">
            </div>
            <div class="form-group">
                <label>Año</label>
                <select id="anio" required>
                    <option value="">Seleccione</option>
                    <option value="1er año">1er año</option>
                    <option value="2do año">2do año</option>
                    <option value="3er año">3er año</option>
                    <option value="4to año">4to año</option>
                    <option value="5to año">5to año</option>
                </select>
            </div>
            <div class="form-group">
                <label>Sección</label>
                <input type="text" id="seccion" placeholder="Ej: A, B, C, D" required>
            </div>
            <div class="form-group">
                <label>Edad</label>
                <input type="number" id="edad" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label>Rol</label>
                <select id="rol">
                    <option value="estudiante">Estudiante</option>
                    <option value="profesor">Profesor</option>
                    <option value="coordinador">Coordinador</option>
                </select>
            </div>
            <button type="submit" class="btn">Registrarse</button>
            <div class="error" id="errorMsg"></div>
        </form>
        <div class="footer">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script>
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '';
            const data = {
                nombre: document.getElementById('nombre').value,
                cedula: document.getElementById('cedula').value,
                telefono1: document.getElementById('telefono1').value,
                telefono2: document.getElementById('telefono2').value || null,
                año: document.getElementById('anio').value,
                seccion: document.getElementById('seccion').value,
                edad: parseInt(document.getElementById('edad').value),
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                rol: document.getElementById('rol').value
            };
            try {
                const response = await fetch(`${API_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (response.ok) {
                    alert('Registro exitoso. Ahora inicia sesión.');
                    window.location.href = 'login.html';
                } else {
                    errorMsg.textContent = result.error || 'Error en el registro';
                }
            } catch (error) {
                errorMsg.textContent = 'Error de conexión con el servidor';
            }
        });
    </script>
</body>
</html>
