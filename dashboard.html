<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Liceo José Augusto D' León</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #b8e2f2;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(145deg, #2a7faa, #1e5f7e);
            color: white;
            padding: 25px 30px;
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: relative;
        }
        .user-info {
            background: rgba(255,255,255,0.2);
            padding: 15px 25px;
            border-radius: 50px;
        }
        .logout-btn {
            background: white;
            color: #2a7faa;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }
        .logout-btn:hover {
            background: #f0f0f0;
        }
        
        /* Estilos para notificaciones */
        .notificacion-container {
            position: relative;
            display: inline-block;
            margin-right: 15px;
        }

        #campanita {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }

        #campanita:hover {
            background: rgba(255,255,255,0.3);
        }

        #contador-notificaciones {
            background: #ff4757;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.8rem;
            min-width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: -5px;
            right: -5px;
            font-weight: bold;
        }

        #panel-notificaciones {
            position: absolute;
            top: 60px;
            right: 0;
            width: 350px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            z-index: 1000;
            max-height: 500px;
            overflow-y: auto;
            border: 2px solid rgba(255,255,255,0.6);
        }

        #panel-notificaciones.visible {
            display: block;
        }

        #panel-notificaciones .header {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            border-radius: 20px 20px 0 0;
            margin-bottom: 0;
        }

        #panel-notificaciones .header h3 {
            color: #0b3b5c;
            margin: 0;
            font-size: 1.2rem;
        }

        #panel-notificaciones .header button {
            background: none;
            border: none;
            color: #2a7faa;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        #panel-notificaciones .header button:hover {
            text-decoration: underline;
        }

        #lista-notificaciones {
            max-height: 400px;
            overflow-y: auto;
        }

        .notificacion-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.3s;
        }

        .notificacion-item:hover {
            background: #f5f5f5;
        }

        .notificacion-item.no-leida {
            background: #e3f2fd;
        }

        .notificacion-titulo {
            font-weight: 600;
            color: #0b3b5c;
            margin-bottom: 5px;
        }

        .notificacion-mensaje {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }

        .notificacion-fecha {
            font-size: 0.8rem;
            color: #999;
        }

        .notificacion-vacia {
            padding: 30px;
            text-align: center;
            color: #999;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 2px solid rgba(255,255,255,0.6);
        }
        .card h3 {
            color: #0b3b5c;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        .card ul {
            list-style: none;
        }
        .card li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
        }
        .card li:last-child {
            border-bottom: none;
        }
        .badge {
            background: #2a7faa;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .role-badge {
            background: #ffc107;
            color: #0b3b5c;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 600;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .nav-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            #panel-notificaciones {
                width: 300px;
                right: -50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📚 Panel de Control</h1>
                <p>Liceo José Augusto D' León</p>
            </div>
            
            <div style="display: flex; align-items: center; gap: 15px;">
                <!-- CAMPANITA DE NOTIFICACIONES -->
                <div class="notificacion-container">
                    <button id="campanita" onclick="toggleNotificaciones()">
                        🔔 <span id="contador-notificaciones" style="display:none;">0</span>
                    </button>
                    <div id="panel-notificaciones">
                        <div class="header">
                            <h3>Notificaciones</h3>
                            <button onclick="marcarTodasLeidas()">Marcar todas</button>
                        </div>
                        <div id="lista-notificaciones">
                            <!-- Las notificaciones se cargarán aquí -->
                            <div class="notificacion-vacia">Cargando notificaciones...</div>
                        </div>
                    </div>
                </div>

                <div class="user-info" id="userInfo">
                    Cargando...
                </div>

                <div class="nav-buttons" id="navButtons">
                    <!-- Los botones se generarán según el rol -->
                </div>

                <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
            </div>
        </div>

        <div id="contenidoPrincipal">
            <!-- El contenido se cargará según el rol -->
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Verificar si hay usuario logueado
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = 'login.html';
        }

        // Mostrar información del usuario
        document.getElementById('userInfo').innerHTML = `
            <strong>${user.nombre}</strong><br>
            <span class="role-badge">${user.rol}</span>
        `;

        // Función para cerrar sesión
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // Función para navegar a páginas específicas
        function irAPagina(pagina) {
            window.location.href = pagina;
        }

        // Generar botones de navegación según el rol
        const navButtons = document.getElementById('navButtons');
        const contenidoPrincipal = document.getElementById('contenidoPrincipal');

        if (user.rol === 'estudiante') {
            navButtons.innerHTML = `
                <button class="nav-btn" onclick="irAPagina('estudiante.html')">📊 Mis Notas</button>
                <button class="nav-btn" onclick="irAPagina('eventos.html')">📅 Eventos</button>
            `;
            contenidoPrincipal.innerHTML = `
                <div class="cards">
                    <div class="card">
                        <h3>📊 Mis Notas</h3>
                        <ul>
                            <li>Matemáticas <span class="badge">Cargando...</span></li>
                            <li>Historia <span class="badge">Cargando...</span></li>
                            <li>Química <span class="badge">Cargando...</span></li>
                        </ul>
                    </div>
                    <div class="card">
                        <h3>📅 Inasistencias</h3>
                        <ul>
                            <li>Últimas 3: <span class="badge">Cargando...</span></li>
                        </ul>
                    </div>
                    <div class="card">
                        <h3>🔔 Próximos Eventos</h3>
                        <ul>
                            <li>📌 Cargando eventos...</li>
                        </ul>
                    </div>
                </div>
                <div class="card">
                    <h3>📋 Información del Estudiante</h3>
                    <p><strong>Nombre:</strong> ${user.nombre}</p>
                    <p><strong>Rol:</strong> ${user.rol}</p>
                    <p><strong>ID:</strong> ${user.id}</p>
                    <p><small>Los datos reales se cargarán cuando conectemos con el backend</small></p>
                </div>
            `;
        } 
        else if (user.rol === 'profesor') {
            navButtons.innerHTML = `
                <button class="nav-btn" onclick="irAPagina('profesor.html')">👥 Mis Secciones</button>
                <button class="nav-btn" onclick="irAPagina('eventos.html')">📅 Crear Evento</button>
            `;
            contenidoPrincipal.innerHTML = `
                <div class="cards">
                    <div class="card">
                        <h3>👥 Mis Secciones</h3>
                        <ul>
                            <li>4to Año "A" <span class="badge">32 estudiantes</span></li>
                            <li>4to Año "B" <span class="badge">28 estudiantes</span></li>
                            <li>5to Año "A" <span class="badge">25 estudiantes</span></li>
                        </ul>
                    </div>
                    <div class="card">
                        <h3>📝 Últimas Notas Cargadas</h3>
                        <ul>
                            <li>Matemáticas 4to A <span class="badge">15/05</span></li>
                            <li>Historia 5to B <span class="badge">14/05</span></li>
                        </ul>
                    </div>
                    <div class="card">
                        <h3>🔔 Eventos Próximos</h3>
                        <ul>
                            <li>📌 Reunión de profesores <span class="badge">25/05</span></li>
                        </ul>
                    </div>
                </div>
                <div class="card">
                    <h3>📋 Información del Profesor</h3>
                    <p><strong>Nombre:</strong> ${user.nombre}</p>
                    <p><strong>Rol:</strong> ${user.rol}</p>
                    <p><strong>ID:</strong> ${user.id}</p>
                </div>
            `;
        } 
        else if (user.rol === 'coordinador') {
            navButtons.innerHTML = `
                <button class="nav-btn" onclick="irAPagina('coordinador.html')">📊 Estadísticas</button>
                <button class="nav-btn" onclick="irAPagina('eventos.html')">📅 Eventos</button>
            `;
            contenidoPrincipal.innerHTML = `
                <div class="cards">
                    <div class="card">
                        <h3>📊 Resumen General</h3>
                        <ul>
                            <li>Total Estudiantes <span class="badge">245</span></li>
                            <li>Total Profesores <span class="badge">18</span></li>
                            <li>Total Secciones <span class="badge">12</span></li>
                        </ul>
                    </div>
                    <div class="card">
                        <h3>📝 Últimos Registros</h3>
                        <ul>
                            <li>Nuevo estudiante <span class="badge">Hoy</span></li>
                            <li>Nuevo profesor <span class="badge">Ayer</span></li>
                        </ul>
                    </div>
                    <div class="card">
                        <h3>🔔 Notificaciones</h3>
                        <ul>
                            <li>📌 3 solicitudes de justificación</li>
                            <li>📌 2 eventos pendientes</li>
                        </ul>
                    </div>
                </div>
                <div class="card">
                    <h3>📋 Información del Coordinador</h3>
                    <p><strong>Nombre:</strong> ${user.nombre}</p>
                    <p><strong>Rol:</strong> ${user.rol}</p>
                    <p><strong>ID:</strong> ${user.id}</p>
                </div>
            `;
        }

        // ===== SISTEMA DE NOTIFICACIONES =====
        let notificaciones = [];
        let notificacionesNoLeidas = 0;

        // Cargar notificaciones del usuario
        function cargarNotificaciones() {
            // Datos de ejemplo
            notificaciones = [
                {
                    id: 1,
                    titulo: "📌 Nueva nota cargada",
                    mensaje: "Tu nota de Matemáticas ha sido publicada",
                    fecha: new Date().toISOString(),
                    leido: false
                },
                {
                    id: 2,
                    titulo: "📅 Evento próximo",
                    mensaje: "Entrega de proyectos de ITP este viernes",
                    fecha: new Date().toISOString(),
                    leido: false
                },
                {
                    id: 3,
                    titulo: "📊 Inasistencia registrada",
                    mensaje: "Se registró una falta el día 15/05/2024",
                    fecha: new Date().toISOString(),
                    leido: true
                }
            ];
            actualizarContadorNotificaciones();
            actualizarListaNotificaciones();
        }

        // Actualizar el contador de la campanita
        function actualizarContadorNotificaciones() {
            notificacionesNoLeidas = notificaciones.filter(n => !n.leido).length;
            
            const campanita = document.getElementById('campanita');
            const contador = document.getElementById('contador-notificaciones');
            
            if (campanita && contador) {
                if (notificacionesNoLeidas > 0) {
                    contador.textContent = notificacionesNoLeidas;
                    contador.style.display = 'flex';
                } else {
                    contador.style.display = 'none';
                }
            }
        }

        // Mostrar lista de notificaciones
        function actualizarListaNotificaciones() {
            const lista = document.getElementById('lista-notificaciones');
            if (!lista) return;

            if (notificaciones.length === 0) {
                lista.innerHTML = '<div class="notificacion-vacia">No hay notificaciones</div>';
                return;
            }

            lista.innerHTML = notificaciones.map(notif => `
                <div class="notificacion-item ${notif.leido ? '' : 'no-leida'}" onclick="marcarComoLeida(${notif.id})">
                    <div class="notificacion-titulo">${notif.titulo}</div>
                    <div class="notificacion-mensaje">${notif.mensaje}</div>
                    <div class="notificacion-fecha">${new Date(notif.fecha).toLocaleDateString()}</div>
                </div>
            `).join('');
        }

        // Marcar notificación como leída
        function marcarComoLeida(id) {
            const notif = notificaciones.find(n => n.id === id);
            if (notif) notif.leido = true;
            
            actualizarContadorNotificaciones();
            actualizarListaNotificaciones();
        }

        // Marcar todas como leídas
        function marcarTodasLeidas() {
            notificaciones.forEach(n => n.leido = true);
            actualizarContadorNotificaciones();
            actualizarListaNotificaciones();
        }

        // Toggle del panel de notificaciones
        function toggleNotificaciones() {
            const panel = document.getElementById('panel-notificaciones');
            if (panel) {
                panel.classList.toggle('visible');
            }
        }

        // Cargar notificaciones al iniciar
        cargarNotificaciones();

        // Cerrar panel al hacer clic fuera
        document.addEventListener('click', function(event) {
            const panel = document.getElementById('panel-notificaciones');
            const campanita = document.getElementById('campanita');
            
            if (panel && campanita && !campanita.contains(event.target) && !panel.contains(event.target)) {
                panel.classList.remove('visible');
            }
        });
    </script>
</body>
</html>
