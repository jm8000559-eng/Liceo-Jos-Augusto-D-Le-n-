<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Liceo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #b8e2f2, #8fc5e8);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .registro-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #0b3b5c;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #1e4a6b;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #2a7faa;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="registro-card">
        <h1>Registro de Estudiante</h1>
        <form id="registroForm">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label>Cédula</label>
                <input type="text" id="cedula" required>
            </div>
            <div class="form-group">
                <label>Teléfono 1</label>
                <input type="tel" id="telefono1" required>
            </div>
            <div class="form-group">
                <label>Teléfono 2 (opcional)</label>
                <input type="tel" id="telefono2">
            </div>
            <div class="form-group">
                <label>Año</label>
                <select id="anio" required>
                    <option value="">Seleccione</option>
                    <option value="1er año">1er año</option>
                    <option value="2do año">2do año</option>
                    <option value="3er año">3er año</option>
                    <option value="4to año">4to año</option>
                    <option value="5to año">5to año</option>
                </select>
            </div>
            <div class="form-group">
                <label>Sección</label>
                <input type="text" id="seccion" placeholder="Ej: A, B, C, D" required>
            </div>
            <div class="form-group">
                <label>Edad</label>
                <input type="number" id="edad" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <!-- Rol fijo: estudiante (oculto) -->
            <input type="hidden" id="rol" value="estudiante">
            <button type="submit">Registrarse</button>
        </form>
        <div class="footer">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('nombre').value,
                cedula: document.getElementById('cedula').value,
                telefono1: document.getElementById('telefono1').value,
                telefono2: document.getElementById('telefono2').value || null,
                año: document.getElementById('anio').value,
                seccion: document.getElementById('seccion').value,
                edad: parseInt(document.getElementById('edad').value),
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                rol: 'estudiante' // fijo
            };
            try {
                const response = await fetch(`${API_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (response.ok) {
                    alert('Registro exitoso. Ahora inicia sesión.');
                    window.location.href = 'login.html';
                } else {
                    alert(result.error || 'Error en el registro');
                }
            } catch (error) {
                alert('Error de conexión con el servidor');
            }
        });
    </script>
</body>
</html>
