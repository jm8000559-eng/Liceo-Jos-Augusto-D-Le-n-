<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <style>
        body {
            background: #b8e2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .form-box {
            background: white;
            padding: 40px;
            border-radius: 30px;
            width: 400px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2a7faa;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Registro de Estudiante</h2>
        <input id="nombre" placeholder="Nombre completo">
        <input id="cedula" placeholder="Cédula">
        <input id="telefono1" placeholder="Teléfono 1">
        <input id="telefono2" placeholder="Teléfono 2 (opcional)">
        <select id="anio">
            <option value="1er año">1er año</option>
            <option value="2do año">2do año</option>
            <option value="3er año">3er año</option>
            <option value="4to año">4to año</option>
            <option value="5to año">5to año</option>
        </select>
        <input id="seccion" placeholder="Sección (A, B, C, D)">
        <input id="edad" type="number" placeholder="Edad">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Contraseña">
        <button onclick="registrar()">Registrarse</button>
        <p><a href="login.html">Ya tengo cuenta</a></p>
    </div>

    <script src="js/config.js"></script>
    <script>
        async function registrar() {
            const data = {
                nombre: document.getElementById('nombre').value,
                cedula: document.getElementById('cedula').value,
                telefono1: document.getElementById('telefono1').value,
                telefono2: document.getElementById('telefono2').value || null,
                año: document.getElementById('anio').value,
                seccion: document.getElementById('seccion').value,
                edad: parseInt(document.getElementById('edad').value),
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                rol: 'estudiante'  // fijo
            };

            const res = await fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (res.ok) {
                alert('Registro exitoso');
                window.location.href = 'login.html';
            } else {
                alert('Error: ' + (result.error || 'Error'));
            }
        }
    </script>
</body>
</html>
