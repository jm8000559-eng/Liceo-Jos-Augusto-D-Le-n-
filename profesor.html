<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Profesor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background-color: #b8e2f2;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(145deg, #2a7faa, #1e5f7e);
            color: white;
            padding: 20px 30px;
            border-radius: 30px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
        }
        .filtros {
            background: white;
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        select, input, button {
            padding: 12px;
            border-radius: 50px;
            border: 1px solid #ddd;
        }
        button {
            background: #2a7faa;
            color: white;
            border: none;
            cursor: pointer;
        }
        .card {
            background: white;
            border-radius: 30px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .input-nota {
            width: 70px;
            padding: 5px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="dashboard.html" class="back-btn">← Volver</a>
            <div id="userInfo">Cargando...</div>
        </div>

        <!-- Filtros -->
        <div class="filtros">
            <select id="anio">
                <option value="">Año</option>
                <option>1er año</option>
                <option>2do año</option>
                <option>3er año</option>
                <option>4to año</option>
                <option>5to año</option>
            </select>
            <select id="seccion">
                <option value="">Sección</option>
                <option>A</option>
                <option>B</option>
                <option>C</option>
                <option>D</option>
            </select>
            <select id="materia">
                <option value="">Materia</option>
                <option>Matemáticas</option>
                <option>Historia</option>
                <option>Química</option>
                <option>Física</option>
                <option>Lengua</option>
            </select>
            <button onclick="cargarEstudiantes()">Cargar</button>
        </div>

        <!-- Lista de estudiantes (vacía) -->
        <div class="card">
            <h2>Lista de Estudiantes</h2>
            <table>
                <thead>
                    <tr><th>Nombre</th><th>Cédula</th><th>Nota</th><th>Acción</th></tr>
                </thead>
                <tbody id="estudiantesBody">
                    <tr><td colspan="4" style="text-align:center;">Seleccione año, sección y materia</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.rol !== 'profesor') window.location.href = 'login.html';
        document.getElementById('userInfo').innerHTML = `<strong>${user.nombre}</strong> (${user.rol})`;

        async function cargarEstudiantes() {
            // Aquí conectarás con el backend para traer los estudiantes reales
            document.getElementById('estudiantesBody').innerHTML = 
                '<tr><td colspan="4" style="text-align:center;">No hay estudiantes en esta sección</td></tr>';
        }
    </script>
</body>
</html>
