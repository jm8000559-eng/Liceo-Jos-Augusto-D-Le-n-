<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Coordinador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background-color: #b8e2f2;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(145deg, #2a7faa, #1e5f7e);
            color: white;
            padding: 20px 30px;
            border-radius: 30px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
        }
        .card {
            background: white;
            border-radius: 30px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        select {
            padding: 5px;
            border-radius: 10px;
        }
        button {
            background: #2a7faa;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="dashboard.html" class="back-btn">← Volver</a>
            <div id="userInfo">Cargando...</div>
        </div>

        <div class="card">
            <h2>👥 Gestión de Usuarios</h2>
            <table>
                <thead>
                    <tr><th>Nombre</th><th>Email</th><th>Rol Actual</th><th>Cambiar Rol</th></tr>
                </thead>
                <tbody id="usuariosBody">
                    <tr><td colspan="4" style="text-align:center;">Cargando usuarios...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.rol !== 'coordinador') window.location.href = 'login.html';
        document.getElementById('userInfo').innerHTML = `<strong>${user.nombre}</strong> (Coordinador)`;

        async function cargarUsuarios() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/api/usuarios`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const usuarios = await res.json();
                const tbody = document.getElementById('usuariosBody');
                tbody.innerHTML = '';
                usuarios.forEach(u => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.nombre}</td>
                            <td>${u.email}</td>
                            <td>${u.rol}</td>
                            <td>
                                <select onchange="cambiarRol(${u.id}, this.value)">
                                    <option value="estudiante" ${u.rol === 'estudiante' ? 'selected' : ''}>Estudiante</option>
                                    <option value="profesor" ${u.rol === 'profesor' ? 'selected' : ''}>Profesor</option>
                                    <option value="coordinador" ${u.rol === 'coordinador' ? 'selected' : ''}>Coordinador</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                document.getElementById('usuariosBody').innerHTML = '<tr><td colspan="4">Error al cargar usuarios</td></tr>';
            }
        }

        async function cambiarRol(id, nuevoRol) {
            const token = localStorage.getItem('token');
            await fetch(`${API_URL}/api/usuarios/${id}/rol`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ rol: nuevoRol })
            });
            alert('Rol actualizado');
        }

        cargarUsuarios();
    </script>
</body>
</html>
