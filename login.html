<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Liceo</title>
    <style>
        body {
            background: linear-gradient(135deg, #b8e2f2, #8fc5e8);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 40px;
            width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            color: #0b3b5c;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #2a7faa;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .register-link {
            margin-top: 20px;
            display: block;
            color: #1e4a6b;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Bienvenido al Sistema Escolar</h1>
        <input type="text" placeholder="Usuario (email)">
        <input type="password" placeholder="Contraseña">
        <button>Iniciar Sesión</button>
        <a href="registro.html" class="register-link">Registrarse</a>
    </div>
</body>
</html>
