<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liceo José Augusto D' León</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #b8e2f2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Elementos decorativos */
        .decor-element {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15), 0 0 0 3px rgba(255, 255, 255, 0.8) inset;
            backdrop-filter: blur(3px);
            border-radius: 15px;
            transform: rotate(var(--rot, 0deg));
            z-index: 0;
        }

        /* Lápices */
        .pencil {
            width: 70px;
            height: 14px;
            background: linear-gradient(90deg, #f9e076 0%, #f9e076 70%, #c0a85d 70%, #c0a85d 80%, #e67e22 80%);
            border-radius: 25px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.1), 0 0 0 3px rgba(255,255,255,0.9) inset;
            position: relative;
        }
        .pencil::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 14px;
            background: #2c3e50;
            right: -5px;
            top: 0;
            border-radius: 3px;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.9) inset;
        }

        /* Mochilas */
        .backpack {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 20px 20px 30px 30px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.1), 0 0 0 3px rgba(255,255,255,0.9) inset;
            position: relative;
        }
        .backpack::before {
            content: '';
            position: absolute;
            width: 45px;
            height: 25px;
            background: rgba(255, 255, 255, 0.6);
            top: -12px;
            left: 22px;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 -5px 0 rgba(255,255,255,0.8) inset;
        }
        .backpack::after {
            content: '';
            position: absolute;
            width: 35px;
            height: 35px;
            border: 4px solid rgba(255,255,255,0.9);
            border-radius: 50%;
            bottom: 12px;
            left: 27px;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.6) inset;
        }

        /* Libros apilados */
        .books {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .book {
            width: 80px;
            height: 18px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 4px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.1), 0 0 0 3px rgba(255,255,255,0.9) inset;
        }
        .book:nth-child(2) { width: 90px; }
        .book:nth-child(3) { width: 70px; }
        .book:nth-child(4) { width: 60px; }

        /* Reglas */
        .ruler {
            width: 100px;
            height: 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.1), 0 0 0 3px rgba(255,255,255,0.9) inset;
            position: relative;
        }
        .ruler::after {
            content: '▏▏▏▏▏';
            position: absolute;
            font-size: 12px;
            color: rgba(0,0,0,0.2);
            left: 5px;
            top: -2px;
            letter-spacing: 8px;
        }

        /* Posiciones */
        .decor1 { top: 5%; left: 2%; --rot: -8deg; }
        .decor2 { bottom: 10%; right: 3%; --rot: 12deg; }
        .decor3 { top: 15%; right: 10%; --rot: 3deg; }
        .decor4 { bottom: 20%; left: 8%; --rot: 20deg; }
        .decor5 { top: 60%; left: 5%; --rot: -15deg; }
        .decor6 { bottom: 5%; left: 20%; --rot: 7deg; }
        .decor7 { top: 30%; right: 20%; --rot: -5deg; }
        .decor8 { bottom: 40%; right: 15%; --rot: 10deg; }
        .decor9 { top: 70%; left: 15%; --rot: 25deg; }
        .decor10 { bottom: 60%; right: 5%; --rot: -12deg; }
        .decor11 { top: 45%; left: 25%; --rot: 5deg; }
        .decor12 { bottom: 75%; right: 25%; --rot: -8deg; }

        /* Tarjeta principal */
        .main-card {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 45px 35px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.2), 0 0 0 3px rgba(255, 255, 255, 0.9) inset;
            z-index: 10;
            position: relative;
            border: 2px solid rgba(255,255,255,0.6);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            font-size: 3rem;
            font-weight: 800;
            color: #0b3b5c;
            text-shadow: 3px 3px 0 rgba(255,255,255,0.8);
            letter-spacing: 2px;
        }
        .logo h1 span {
            display: block;
            font-size: 2rem;
            font-weight: 400;
        }
        .logo p {
            font-size: 1.2rem;
            color: #1e4a6b;
            background: rgba(255,255,255,0.6);
            display: inline-block;
            padding: 10px 25px;
            border-radius: 60px;
            margin-top: 15px;
            font-weight: 500;
            backdrop-filter: blur(4px);
            box-shadow: 0 3px 0 rgba(255,255,255,0.8) inset;
        }

        .welcome {
            text-align: center;
            margin-bottom: 40px;
        }
        .welcome h2 {
            font-size: 2.2rem;
            color: #0b3b5c;
            margin-bottom: 10px;
        }
        .welcome p {
            font-size: 1.3rem;
            color: #1e4a6b;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .btn {
            padding: 18px 22px;
            border: none;
            border-radius: 70px;
            font-size: 1.4rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: block;
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.1), 0 0 0 3px rgba(255,255,255,0.9) inset;
            backdrop-filter: blur(4px);
        }
        .btn-primary {
            background-color: #2a7faa;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1e5f7e;
            transform: translateY(-3px);
            box-shadow: 0 13px 0 rgba(0, 0, 0, 0.1), 0 0 0 3px rgba(255,255,255,0.9) inset;
        }
        .btn-secondary {
            background-color: #f4f9ff;
            color: #0b3b5c;
        }
        .btn-secondary:hover {
            background-color: #e0ecf9;
            transform: translateY(-3px);
        }

        .footer {
            text-align: center;
            font-size: 1rem;
            color: #1e4a6b;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 2px dashed rgba(255,255,255,0.7);
        }

        @media (max-width: 600px) {
            .main-card { padding: 30px 20px; }
            .logo h1 { font-size: 2.5rem; }
            .logo h1 span { font-size: 1.6rem; }
            .welcome h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <!-- Elementos decorativos -->
    <div class="decor-element pencil decor1"></div>
    <div class="decor-element backpack decor2"></div>
    <div class="decor-element books decor3">
        <div class="book"></div>
        <div class="book"></div>
        <div class="book"></div>
        <div class="book"></div>
    </div>
    <div class="decor-element ruler decor4"></div>
    <div class="decor-element pencil decor5" style="width:90px;"></div>
    <div class="decor-element backpack decor6"></div>
    <div class="decor-element books decor7">
        <div class="book"></div>
        <div class="book"></div>
        <div class="book"></div>
    </div>
    <div class="decor-element ruler decor8"></div>
    <div class="decor-element pencil decor9"></div>
    <div class="decor-element backpack decor10"></div>
    <div class="decor-element books decor11">
        <div class="book"></div>
        <div class="book"></div>
        <div class="book"></div>
    </div>
    <div class="decor-element ruler decor12"></div>

    <!-- Tarjeta principal -->
    <div class="main-card">
        <div class="logo">
            <h1>
                LICEO<br>
                <span>JOSÉ AUGUSTO D' LEÓN</span>
            </h1>
            <p>Fundada en 1978 · Los Robles · Est. Nacional Española</p>
        </div>
        <div class="welcome">
            <h2>¡Bienvenidos!</h2>
            <p>Gestión de notas, eventos y más</p>
        </div>
        <div class="buttons">
            <!-- ESTA LÍNEA YA ESTÁ CORREGIDA -->
            <a href="login.html" class="btn btn-primary">Iniciar sesión</a>
            <a href="registro.html" class="btn btn-secondary">Registrarse</a>
        </div>
        <div class="footer">
            Plataforma educativa para toda la comunidad liceísta · Todos los años y secciones
        </div>
    </div>
</body>
</html>
