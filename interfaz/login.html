<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Liceo José Augusto D' León</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #b8e2f2 0%, #8fc5e8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: flex;
            max-width: 1100px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        /* Panel izquierdo con información del liceo */
        .info-panel {
            background: linear-gradient(145deg, #2a7faa, #1e5f7e);
            color: white;
            padding: 50px 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-panel h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .info-panel h1 span {
            display: block;
            font-size: 1.8rem;
            font-weight: 400;
            margin-top: 5px;
        }

        .info-panel .slogan {
            font-size: 1.2rem;
            margin: 20px 0 30px;
            opacity: 0.9;
            font-style: italic;
        }

        .info-panel .feature {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .info-panel .feature i {
            font-size: 1.5rem;
            margin-right: 15px;
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 50%;
        }

        /* Panel derecho con formulario */
        .form-panel {
            padding: 50px 40px;
            flex: 1;
            background: white;
        }

        .form-panel h2 {
            font-size: 2rem;
            color: #0b3b5c;
            margin-bottom: 10px;
        }

        .form-panel .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1e4a6b;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        input:focus {
            border-color: #2a7faa;
            box-shadow: 0 0 0 3px rgba(42, 127, 170, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(145deg, #2a7faa, #1e5f7e);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
        }

        .register-link a {
            color: #2a7faa;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error {
            color: #d32f2f;
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
        }

        /* Elementos decorativos (lápices, etc) opcionales */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .info-panel {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Panel izquierdo con información del liceo -->
        <div class="info-panel">
            <h1>
                LICEO<br>
                <span>JOSÉ AUGUSTO D' LEÓN</span>
            </h1>
            <p class="slogan">Excelencia y Compromiso Educativo</p>
            
            <div class="feature">
                <i>📚</i>
                <span>Gestión académica integral</span>
            </div>
            <div class="feature">
                <i>📊</i>
                <span>Notas y asistencias en línea</span>
            </div>
            <div class="feature">
                <i>🔔</i>
                <span>Notificaciones de eventos</span>
            </div>
            <div class="feature">
                <i>👥</i>
                <span>Comunicación directa</span>
            </div>
        </div>

        <!-- Panel derecho con formulario de login -->
        <div class="form-panel">
            <h2>Bienvenido</h2>
            <p class="subtitle">Sistema Escolar</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Usuario (Email)</label>
                    <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">Iniciar Sesión</button>
                <div class="error" id="errorMsg"></div>
            </form>

            <div class="register-link">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '';

            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (response.ok) {
                    // Guardamos el token y datos del usuario
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('user', JSON.stringify(result.usuario));
                    // Redirigir al dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = result.error || 'Error en el inicio de sesión';
                }
            } catch (error) {
                errorMsg.textContent = 'Error de conexión con el servidor';
            }
        });
    </script>
</body>
</html>
