<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Estudiante</title>
    <style>
        /* Estilos iguales a los que ya tienes */
    </style>
</head>
<body>
    <div class="container">
        <!-- Encabezado igual -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="promedioGeneral">-</div>
                <div class="stat-label">Promedio General</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalInasistencias">0</div>
                <div class="stat-label">Inasistencias</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="materiasAprobadas">-</div>
                <div class="stat-label">Materias Aprobadas</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="eventosProximos">0</div>
                <div class="stat-label">Eventos Próximos</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h2>📊 Mis Notas</h2>
                <table>
                    <thead>
                        <tr><th>Materia</th><th>Nota</th><th>Fecha</th></tr>
                    </thead>
                    <tbody id="notasBody">
                        <tr><td colspan="3">No hay notas registradas</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="card">
                <h2>📅 Inasistencias</h2>
                <table>
                    <thead>
                        <tr><th>Fecha</th><th>Estado</th><th>Justificación</th><th>Acción</th></tr>
                    </thead>
                    <tbody id="asistenciasBody">
                        <tr><td colspan="4">No hay inasistencias registradas</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>🔔 Próximos Eventos</h2>
            <div id="eventosList">No hay eventos próximos</div>
        </div>

        <div class="card">
            <h2>📋 Mi Información</h2>
            <div id="infoPersonal">Cargando...</div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = 'login.html';
        document.getElementById('infoPersonal').innerHTML = `<p><strong>Nombre:</strong> ${user.nombre}</p><p><strong>Rol:</strong> ${user.rol}</p><p>Los datos reales se cargarán desde el backend.</p>`;
        // Funciones vacías (sin datos de ejemplo)
        async function cargarNotas() { /* llamada real al backend */ }
        async function cargarAsistencias() {}
        async function cargarEventos() {}
    </script>
</body>
</html>
